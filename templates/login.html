<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CV Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            color: #333;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: #666;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* ── OWNER BLOCK ── remove this entire block when ready to restore access */
        .owner-block {
            background: #fff4e5;
            border: 2px solid #f0a500;
            border-radius: 14px;
            padding: 30px 25px;
            text-align: center;
        }

        .owner-block .lock-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .owner-block h2 {
            color: #b36200;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .owner-block p {
            color: #7a4500;
            font-size: 1rem;
            line-height: 1.6;
        }
        /* ── END OWNER BLOCK ── */

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fff;
            outline: none;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .form-input:hover {
            border-color: #b8c5f2;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-link {
            background: transparent;
            color: #667eea;
            text-decoration: none;
            border: 2px solid #667eea;
            display: inline-block;
            text-align: center;
        }

        .btn-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: 500;
            border-left: 4px solid;
            animation: slideInDown 0.5s ease;
        }

        .alert-danger {
            background-color: #ffe6e6;
            color: #cc0000;
            border-left-color: #ff4444;
        }

        .alert-success {
            background-color: #e6ffe6;
            color: #006600;
            border-left-color: #44ff44;
        }

        .alert-info {
            background-color: #e6f3ff;
            color: #0066cc;
            border-left-color: #4499ff;
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            color: #666;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #ddd, transparent);
        }

        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }

        .footer-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; margin: 10px; }
            .login-header h1 { font-size: 2rem; }
            .form-input { padding: 12px 15px; }
            .btn { padding: 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>WILink</h1>
            <p>Welcome back! Please sign in to your account.</p>
        </div>

        <!-- ── OWNER BLOCK ── remove this entire section when ready to restore access -->
        <div class="owner-block">
            <div class="lock-icon">🔒</div>
            <h2>This page is currently unavailable.</h2>
            <p>Please contact the owner of this website to gain access.</p>
        </div>
        <!-- ── END OWNER BLOCK ── -->

        <!-- FORM HIDDEN UNTIL RESTORED — remove the style="display:none" below when ready -->
        <div style="display:none">
            <form id="loginForm" method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
                <div class="divider"><span>or</span></div>
                <a href="{{ url_for('register') }}" class="btn btn-link">Create New Account</a>
            </form>
            <div class="footer-text">
                <p>Forgot your password? <a href="#" onclick="alert('Password reset feature coming soon!')">Reset it here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
