<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CV Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        }

        .register-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .register-header h1 {
            color: #333;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-header p {
            color: #666;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* ── OWNER BLOCK ── remove this entire block when ready to restore access */
        .owner-block {
            background: #fff4e5;
            border: 2px solid #f0a500;
            border-radius: 14px;
            padding: 30px 25px;
            text-align: center;
        }

        .owner-block .lock-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .owner-block h2 {
            color: #b36200;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .owner-block p {
            color: #7a4500;
            font-size: 1rem;
            line-height: 1.6;
        }
        /* ── END OWNER BLOCK ── */

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fff;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 20px;
        }

        .btn-link {
            background: transparent;
            color: #667eea;
            text-decoration: none;
            border: 2px solid #667eea;
            display: inline-block;
            text-align: center;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            color: #666;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #ddd, transparent);
        }

        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            .register-container { padding: 30px 20px; margin: 10px; }
            .register-header h1 { font-size: 2rem; }
            .form-input, .form-select { padding: 12px 15px; }
            .btn { padding: 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>WILink</h1>
            <p>Create your account to get started</p>
        </div>

        <!-- ── OWNER BLOCK ── remove this entire section when ready to restore access -->
        <div class="owner-block">
            <div class="lock-icon">🔒</div>
            <h2>This page is currently unavailable.</h2>
            <p>Please contact the owner of this website to gain access.</p>
        </div>
        <!-- ── END OWNER BLOCK ── -->

        <!-- FORM HIDDEN UNTIL RESTORED — remove the style="display:none" below when ready -->
        <div style="display:none">
            <form id="registerForm" method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" required
                           placeholder="Enter your email address" value="{{ request.form.email if request.form.email }}">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" name="password" required
                           placeholder="Create a strong password" minlength="6">
                    <div class="password-requirements">Password must be at least 6 characters long</div>
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-input" id="confirm_password" name="confirm_password" required
                           placeholder="Confirm your password">
                </div>
                <button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>
                <div class="divider"><span>or</span></div>
                <a href="{{ url_for('login') }}" class="btn btn-link">Already have an account? Sign In</a>
            </form>
            <div class="footer-text">
                <p>By creating an account, you agree to our <a href="#" onclick="alert('Terms of Service coming soon!')">Terms of Service</a></p>
            </div>
        </div>
    </div>
</body>
</html>
